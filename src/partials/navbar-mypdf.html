<!-- Sidebar + topbar mypdf.id (aktif bila MYPDF=true). -->
<aside class="mp-sidebar" id="mp-sidebar" aria-label="Navigasi utama">
  <a href="/" class="mp-side-brand" id="home-logo">
    <img
      id="nav-logo"
      src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
      alt="Logo mypdf.id"
      class="h-10 w-10"
    />
    <span class="mp-side-brand-text">
      <span id="nav-brand">mypdf.id</span>
      <small>PRIVAT · LOKAL · GRATIS</small>
    </span>
  </a>

  <div class="mp-drawer-head">
    <span>Alat</span>
    <button
      type="button"
      class="mp-drawer-close"
      data-drawer-close
      aria-label="Tutup menu"
    >
      <i data-lucide="x"></i>
    </button>
  </div>

  {{> sidebar-nav-mypdf }}

  <div class="mp-side-foot">
    <a
      href="https://saweria.co/mypdfid"
      class="mp-donate"
      target="_blank"
      rel="noopener noreferrer"
      ><i data-lucide="heart" aria-hidden="true"></i><span>Donasi</span></a
    >
  </div>
</aside>
<div class="mp-drawer-backdrop" data-drawer-close></div>

<header class="mp-topbar">
  <button
    id="mobile-menu-button"
    type="button"
    class="mp-menu-btn"
    aria-controls="mp-sidebar"
    aria-expanded="false"
  >
    <span class="sr-only">Buka menu</span>
    <i data-lucide="menu"></i>
  </button>

  <a href="/" class="mp-top-brand">
    <img
      src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
      alt=""
      class="h-8 w-8"
    />
    <span>mypdf.id</span>
  </a>

  <button
    type="button"
    class="mp-top-search"
    data-open-search
    aria-label="Cari alat PDF"
  >
    <i data-lucide="search" class="w-4 h-4"></i>
    <span class="mp-top-search-text">Cari alat PDF...</span>
    <kbd class="mp-kbd" aria-hidden="true">Ctrl K</kbd>
  </button>
  <button
    type="button"
    class="mp-theme-toggle mp-search-icon"
    data-open-search
    aria-label="Cari alat PDF"
  >
    <i data-lucide="search" class="w-4 h-4"></i>
  </button>

  <span class="mp-top-privacy"
    ><i data-lucide="shield-check" class="w-4 h-4"></i>File tidak diunggah</span
  >
  <button
    type="button"
    class="mp-theme-toggle"
    data-theme-toggle
    aria-label="Ganti ke mode gelap"
    title="Ganti tema"
  >
    <svg
      class="mp-icon-moon"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
    <svg
      class="mp-icon-sun"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
      />
    </svg>
  </button>
</header>
