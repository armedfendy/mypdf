<!-- Navbar mypdf.id (aktif bila MYPDF=true). -->
<nav class="bg-gray-900 border-b border-white/10 sticky top-0 z-30">

    <div class="flex justify-between items-center h-16">
      <div
        class="flex-shrink-0 flex items-center cursor-pointer"
        id="home-logo"
      >
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
          alt="Logo mypdf.id"
          class="h-8 w-8"
        />
        <span id="nav-brand" class="text-white font-bold text-xl ml-2">
          <a href="/">mypdf.id</a>
        </span>
      </div>

      <!-- Navigasi desktop -->
      <div
        class="hidden lg:flex flex-1 items-center justify-center space-x-2 xl:space-x-8"
      >
        <a href="/" class="nav-link">Beranda</a>
        <a href="/#tools-header" class="nav-link">Semua Alat</a>
        <a href="/about" class="nav-link">Tentang</a>
        <a href="/faq" class="nav-link">FAQ</a>
        <a href="/contact" class="nav-link">Kontak</a>
      </div>

      <div class="hidden lg:flex items-center flex-shrink-0">
        <a
          href="https://github.com/armedfendy/mypdf"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 text-sm font-medium bg-gray-800 text-gray-200 border border-gray-600 pl-2.5 pr-3 py-1 rounded-full transition-colors duration-200 shadow-sm hover:shadow-md hover:bg-gray-700"
        >
          <i data-lucide="code-xml" class="w-4 h-4"></i>
          <span>Kode Sumber</span>
        </a>
      </div>

      <!-- Tombol menu mobile -->
      <div class="lg:hidden flex items-center gap-4">
        <button
          id="mobile-menu-button"
          type="button"
          class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 transition-colors"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          <span class="sr-only">Buka menu</span>
          <svg
            id="menu-icon"
            class="block h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <svg
            id="close-icon"
            class="hidden h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

  <!-- Menu mobile -->
  <div
    id="mobile-menu"
    class="hidden lg:hidden bg-gray-900 border-t border-white/10"
  >
    <div class="px-2 pt-2 pb-3 space-y-1 text-center">
      <a href="/" class="mobile-nav-link">Beranda</a>
      <a href="/#tools-header" class="mobile-nav-link">Semua Alat</a>

      <a href="/faq" class="mobile-nav-link">FAQ</a>

      <a
        href="https://github.com/armedfendy/mypdf"
        target="_blank"
        rel="noopener noreferrer"
        class="mobile-nav-link"
        >Kode Sumber</a
      >
    </div>
